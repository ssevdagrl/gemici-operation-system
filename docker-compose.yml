services:
  postgres:
    image: postgres:17-alpine
    container_name: busops-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - busops_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: busops-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - busops_redis_data:/data
    command: redis-server --appendonly yes

volumes:
  busops_postgres_data:
  busops_redis_data: